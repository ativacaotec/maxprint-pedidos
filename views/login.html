<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catálogos Ativação</title>
<style>
  :root{ --laranja:#EB8704; --preto:#0B0B0C; --cinza:#8D8E8E; --claro:#F4F4F5; }
  *{ box-sizing:border-box; }
  body{ margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
        font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
        background:var(--preto); color:#fff; padding:20px; }
  .fundo{ position:fixed; inset:0; background:
      radial-gradient(900px 500px at 20% -10%, rgba(235,135,4,.22), transparent 60%),
      radial-gradient(700px 400px at 110% 110%, rgba(235,135,4,.12), transparent 60%); }
  .caixa{ position:relative; width:100%; max-width:400px; background:#fff; color:var(--preto);
          border-radius:16px; padding:34px 30px; box-shadow:0 24px 60px rgba(0,0,0,.45); }
  .marcas{ display:flex; align-items:center; gap:14px; margin-bottom:26px; }
  .marcas img{ height:26px; }
  .marcas .barra{ width:1px; height:26px; background:#ddd; }
  h1{ font-size:19px; margin:0 0 4px; letter-spacing:-.3px; }
  p.sub{ margin:0 0 22px; color:var(--cinza); font-size:13px; }
  label{ display:block; font-size:11px; font-weight:700; color:var(--cinza);
         text-transform:uppercase; letter-spacing:.5px; margin-bottom:6px; }
  input{ width:100%; padding:12px 13px; border:1.5px solid #E3E3E5; border-radius:9px;
         font-size:15px; margin-bottom:16px; transition:border-color .15s; }
  input:focus{ outline:none; border-color:var(--laranja); }
  button{ width:100%; padding:13px; border:0; border-radius:9px; background:var(--laranja);
          color:#fff; font-size:15px; font-weight:700; cursor:pointer; }
  button:hover{ filter:brightness(1.06); }
  button:disabled{ opacity:.6; cursor:default; }
  .erro{ background:#FDECEC; color:#B42318; border-radius:8px; padding:10px 12px;
         font-size:13px; margin-bottom:14px; display:none; }
  .rodape{ margin-top:22px; text-align:center; font-size:11px; color:var(--cinza); }
</style>
</head>
<body>
<div class="fundo"></div>
<form class="caixa" id="form">
  <div class="marcas">
    <img src="/logos/ativacao-preta.png" alt="Ativação Group">
  </div>

  <h1>Pedidos de pronto entrega</h1>
  <p class="sub">Entre com o usuário e a senha que o representante enviou.</p>

  <div class="erro" id="erro"></div>

  <label for="usuario">Usuário</label>
  <input id="usuario" name="usuario" autocomplete="username" autocapitalize="none" required>

  <label for="senha">Senha</label>
  <input id="senha" name="senha" type="password" autocomplete="current-password" required>

  <button id="botao" type="submit">Entrar</button>

  <div class="rodape">Ativação Group · catálogos de pronto entrega</div>
</form>

<script>
const form = document.getElementById('form');
const erro = document.getElementById('erro');
const botao = document.getElementById('botao');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  erro.style.display = 'none';
  botao.disabled = true;
  botao.textContent = 'Entrando...';
  try {
    const r = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({
        usuario: document.getElementById('usuario').value,
        senha: document.getElementById('senha').value,
      }),
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.erro || 'Não consegui entrar.');
    location.href = d.destino;
  } catch (ex) {
    erro.textContent = ex.message;
    erro.style.display = 'block';
    botao.disabled = false;
    botao.textContent = 'Entrar';
  }
});
</script>
</body>
</html>
