<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel · Catálogos Ativação</title>
<link rel="icon" href="/logos/ativacao.png">
<style>
:root{ --laranja:#EB8704; --laranja-claro:#FFF3E3; --preto:#0B0B0C; --cinza:#8D8E8E;
       --borda:#E5E5E7; --claro:#F4F4F5; --verde:#0E9F6E; --vermelho:#D92D20; --azul:#1D4ED8; }
*{ box-sizing:border-box; }
body{ margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
      background:var(--claro); color:var(--preto); font-size:14px; }
img{ display:block; }
header{ background:var(--preto); height:56px; display:flex; align-items:center; gap:14px;
        padding:0 18px; position:sticky; top:0; z-index:40; }
header img{ height:19px; }
header img.mx{ filter:invert(1); }
header .barra{ width:1px; height:19px; background:#3A3A3D; }
header .titulo{ color:#fff; font-size:14px; font-weight:600; margin-left:6px; }
header .espaco{ flex:1; }
header button{ background:#1B1B1E; color:#fff; border:1px solid #2C2C2F; border-radius:8px;
               padding:7px 12px; font-size:13px; cursor:pointer; }
.abas{ background:#fff; border-bottom:1px solid var(--borda); display:flex; gap:2px;
       padding:0 18px; position:sticky; top:56px; z-index:39; overflow-x:auto; }
.abas button{ background:none; border:0; padding:13px 15px; font-size:13.5px; cursor:pointer;
              border-bottom:2.5px solid transparent; color:#555; white-space:nowrap; }
.abas button.ativa{ color:var(--preto); border-bottom-color:var(--laranja); font-weight:700; }
main{ padding:20px 18px 80px; max-width:1400px; margin:0 auto; }
h1{ font-size:19px; margin:0 0 4px; }
p.sub{ color:var(--cinza); font-size:13px; margin:0 0 18px; }
.cartoes{ display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px;
          margin-bottom:22px; }
.cartao{ background:#fff; border:1px solid var(--borda); border-radius:12px; padding:14px 16px; }
.cartao .r{ font-size:10.5px; text-transform:uppercase; letter-spacing:.6px; color:var(--cinza); }
.cartao .v{ font-size:25px; font-weight:800; letter-spacing:-.6px; margin-top:3px; }
.cartao.destaque{ background:var(--preto); color:#fff; border-color:var(--preto); }
.cartao.destaque .v{ color:var(--laranja); }
.painel{ background:#fff; border:1px solid var(--borda); border-radius:12px; padding:18px;
         margin-bottom:18px; }
.painel h2{ font-size:15px; margin:0 0 3px; }
.painel p.d{ font-size:12.5px; color:var(--cinza); margin:0 0 14px; }
table{ width:100%; border-collapse:collapse; font-size:13px; }
th{ text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.5px;
    color:var(--cinza); padding:8px 10px; border-bottom:1px solid var(--borda); }
td{ padding:9px 10px; border-bottom:1px solid var(--claro); vertical-align:middle; }
tr:hover td{ background:#FCFCFD; }
.etiq{ font-size:10.5px; font-weight:700; padding:2px 8px; border-radius:20px; }
.etiq.novo{ background:var(--laranja); color:#fff; }
.etiq.digitado{ background:#DBEAFE; color:var(--azul); }
.etiq.faturado{ background:#DCFCE7; color:var(--verde); }
.etiq.cancelado{ background:var(--claro); color:var(--cinza); }
button.acao{ border:1px solid var(--borda); background:#fff; border-radius:7px; padding:5px 10px;
             font-size:12px; cursor:pointer; }
button.acao:hover{ border-color:var(--laranja); color:var(--laranja); }
button.primaria{ background:var(--laranja); color:#fff; border:0; border-radius:9px;
                 padding:10px 16px; font-size:14px; font-weight:700; cursor:pointer; }
button.primaria:disabled{ background:#E5E5E7; color:#A0A0A3; cursor:default; }
a.acao{ text-decoration:none; color:inherit; }
.solto{ display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; margin-bottom:14px; }
.campo{ display:flex; flex-direction:column; }
.campo label{ font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.5px;
              color:var(--cinza); margin-bottom:4px; }
.campo input, .campo select, .campo textarea{ padding:9px 11px; border:1.5px solid var(--borda);
       border-radius:8px; font-size:14px; font-family:inherit; }
.campo input:focus, .campo select:focus{ outline:none; border-color:var(--laranja); }
.import{ display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:14px; }
.caixa-import{ border:2px dashed var(--borda); border-radius:12px; padding:18px; text-align:center; }
.caixa-import h3{ margin:0 0 4px; font-size:14px; }
.caixa-import p{ font-size:12px; color:var(--cinza); margin:0 0 12px; min-height:48px; }
.caixa-import input[type=file]{ display:none; }
.caixa-import label{ display:inline-block; background:var(--preto); color:#fff; border-radius:8px;
                     padding:9px 16px; font-size:13px; cursor:pointer; }
.caixa-import .arqs{ font-size:11.5px; color:var(--cinza); margin-top:9px; min-height:16px; }
.aviso{ background:#FFF8E6; border:1px solid #F5D98A; border-radius:9px; padding:10px 13px;
        font-size:12.5px; margin-top:12px; }
.aviso.ok{ background:#ECFDF3; border-color:#A6E9C5; }
.aviso.erro{ background:#FDECEC; border-color:#F3B5B0; color:#B42318; }
.grade-rel{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
.senha{ font-family:ui-monospace,Menlo,monospace; background:var(--claro); padding:3px 8px;
        border-radius:6px; font-size:13px; }
.tapa{ position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:80; display:none;
       align-items:flex-start; justify-content:center; padding:26px 14px; overflow-y:auto; }
.tapa.aberto{ display:flex; }
.janela{ background:#fff; border-radius:14px; width:100%; max-width:700px; padding:22px 24px; }
.campos{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.campos .cheio{ grid-column:1/-1; }
.oculto{ display:none !important; }

/* escolha de marcas no cadastro do cliente e na aba Marcas */
.marcas-escolha{ display:flex; flex-wrap:wrap; gap:8px; }
/* `text-transform` e o tamanho pequeno vêm de `.campo label`, que serve para
   rótulo de campo. Aqui o texto é o NOME DA MARCA — tem que sair como está
   escrito ("American Tourister", não "AMERICAN TOURISTER"). */
.marca-op{ display:flex; align-items:center; gap:7px; border:1.5px solid var(--borda);
           border-radius:9px; padding:8px 12px; font-size:13.5px; cursor:pointer; background:#fff;
           text-transform:none; letter-spacing:normal; color:var(--preto); font-weight:500;
           margin-bottom:0; }
.marca-op:has(input:checked){ border-color:var(--laranja); background:var(--laranja-claro); font-weight:600; }
.marca-op input{ margin:0; }
.ponto{ width:11px; height:11px; border-radius:50%; display:inline-block; flex:none; }

/* Tabela larga em tela estreita: rola sozinha em vez de espremer as colunas
   até o texto virar uma coluna de letras. */
.rolagem{ overflow-x:auto; -webkit-overflow-scrolling:touch; }

@media (max-width:900px){ .grade-rel{ grid-template-columns:1fr; } .campos{ grid-template-columns:1fr; } }

@media (max-width:640px){
  header{ height:52px; padding:0 12px; gap:9px; }
  header .titulo{ display:none; }
  header #quem{ display:none; }
  .abas{ top:52px; padding:0 8px; }
  .abas button{ padding:12px 11px; font-size:13px; }
  main{ padding:16px 12px 70px; }
  .painel{ padding:14px; }
  .cartoes{ grid-template-columns:1fr 1fr; gap:9px; }
  .cartao .v{ font-size:21px; }
  .janela{ padding:18px 16px; }
  .import{ grid-template-columns:1fr; }
  /* Tabela do painel no celular: em vez de espremer as colunas até o texto
     virar uma coluna de letras, o bloco inteiro rola de lado. Vale para
     qualquer tabela, esteja ela dentro de .rolagem ou não. */
  .painel{ overflow-x:auto; }
  .painel table{ min-width:560px; }
}
</style>
</head>
<body>

<header>
  <img src="/logos/ativacao-branca.png" alt="Ativação">
  <div class="barra"></div>
  <!-- O sistema deixou de ser de uma marca só: o painel atende Maxprint e
       Samsonite, então o cabeçalho carrega o nome da casa, não o da fábrica.
       A marca aparece onde ela de fato manda: nas abas do catálogo. -->
  <span class="titulo">Catálogos Ativação</span>
  <div class="espaco"></div>
  <span style="color:#8D8E8E;font-size:12.5px" id="quem"></span>
  <button id="sair">Sair</button>
</header>

<div class="abas">
  <button data-aba="pedidos" class="ativa">Pedidos</button>
  <button data-aba="importar">Importar bases</button>
  <button data-aba="clientes">Clientes</button>
  <button data-aba="produtos">Produtos e fotos</button>
  <button data-aba="marcas">Marcas</button>
  <button data-aba="relatorios">Relatórios</button>
  <button data-aba="config">Configuração</button>
</div>

<main>
  <section id="aba-pedidos"></section>
  <section id="aba-importar" class="oculto"></section>
  <section id="aba-clientes" class="oculto"></section>
  <section id="aba-produtos" class="oculto"></section>
  <section id="aba-marcas" class="oculto"></section>
  <section id="aba-relatorios" class="oculto"></section>
  <section id="aba-config" class="oculto"></section>
</main>

<div class="tapa" id="tapa"><div class="janela" id="janela"></div></div>

<script>
const $ = (id) => document.getElementById(id);
const dinheiro = (v) => Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const data = (d) => new Date(d).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'});
const esc = (s) => String(s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/**
 * Chamada à API com erro que se explica.
 *
 * Antes, qualquer resposta que não fosse JSON virava "Deu erro." na tela — e
 * "Deu erro" não diz se o arquivo era grande demais, se a sessão caiu ou se o
 * servidor engasgou. Quando não vem JSON, o que aparece agora é o código HTTP
 * e o começo da resposta, que é o suficiente para saber onde olhar.
 */
const api = async (url, opcoes) => {
  let r;
  try {
    r = await fetch(url, opcoes);
  } catch (e) {
    throw new Error(`A conexão caiu no meio do envio (${e.message}). Em arquivo grande, `
      + 'costuma ser tempo de upload: mande menos arquivos por vez.');
  }
  const texto = await r.text().catch(() => '');
  let d = {};
  try { d = texto ? JSON.parse(texto) : {}; } catch (_) { d = {}; }
  if (!r.ok) {
    if (d.erro) throw new Error(d.erro);
    const pista = texto.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 140);
    const porTamanho = r.status === 413;
    throw new Error(
      `O servidor respondeu ${r.status}${pista ? ' — ' + pista : ''}.`
      + (porTamanho ? ' Isso é limite de tamanho: mande menos arquivos por vez.' : '')
    );
  }
  return d;
};

let EU = null;

/* ============================== abas ============================== */
document.querySelectorAll('.abas button').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('.abas button').forEach(x => x.classList.remove('ativa'));
    b.classList.add('ativa');
    document.querySelectorAll('main section').forEach(s => s.classList.add('oculto'));
    $('aba-' + b.dataset.aba).classList.remove('oculto');
    ({ pedidos: abaPedidos, importar: abaImportar, clientes: abaClientes,
       produtos: abaProdutos, marcas: abaMarcas, relatorios: abaRelatorios,
       config: abaConfig })[b.dataset.aba]();
  });
});

$('sair').onclick = async () => { await fetch('/api/auth/sair',{method:'POST'}); location.href='/login'; };
$('tapa').onclick = (e) => { if (e.target === $('tapa')) $('tapa').classList.remove('aberto'); };
const fecharJanela = () => $('tapa').classList.remove('aberto');

/* ============================= pedidos ============================= */
async function abaPedidos() {
  const [resumo, pedidos] = await Promise.all([
    api('/api/admin/resumo'),
    api('/api/pedidos?limite=200'),
  ]);

  const novos = pedidos.filter(p => p.status === 'novo');
  const resto = pedidos.filter(p => p.status !== 'novo');

  $('aba-pedidos').innerHTML = `
    <h1>Pedidos</h1>
    <p class="sub">O que chegou de cliente, em ordem de chegada.</p>

    <div class="cartoes">
      <div class="cartao destaque"><div class="r">Pedidos novos</div><div class="v">${resumo.pedidos.novos}</div></div>
      <div class="cartao"><div class="r">Digitados</div><div class="v">${resumo.pedidos.digitados}</div></div>
      <div class="cartao"><div class="r">Faturados</div><div class="v">${resumo.pedidos.faturados}</div></div>
      <div class="cartao"><div class="r">Últimos 30 dias</div><div class="v" style="font-size:20px">${dinheiro(resumo.ultimos30.total)}</div></div>
      <div class="cartao"><div class="r">Produtos no ar</div><div class="v">${resumo.produtos}</div></div>
      <div class="cartao"><div class="r">Clientes ativos</div><div class="v">${resumo.clientes}</div></div>
    </div>

    ${resumo.emailConfigurado === false ? `<div class="aviso erro">
      <b>O aviso de pedido novo por e-mail está desligado.</b> Falta a chave do serviço de envio
      (<code>EMAIL_API_KEY</code>) no arquivo <code>.env</code> do servidor. Enquanto isso, os pedidos
      chegam normalmente e aparecem aqui, mas ninguém é avisado por e-mail.
      ${resumo.naoAvisados ? `<br>${resumo.naoAvisados} pedido(s) novo(s) ficaram sem aviso.` : ''}
    </div>` : `<div class="aviso ok" style="display:flex;align-items:center;gap:12px">
      <span>Aviso de pedido novo por e-mail: <b>ligado</b>.</span>
      <button class="acao" id="testar-email">Enviar e-mail de teste</button>
      <span id="resultado-email"></span>
    </div>`}

    ${resumo.semFoto > 0 ? `<div class="aviso">${resumo.semFoto} produtos estão no catálogo sem foto.
      Veja a aba <b>Produtos e fotos</b> para anexar as imagens dos que importam.</div>` : ''}

    <div class="painel">
      <h2>Chegaram agora</h2>
      <p class="d">Pedido novo é o que ainda não foi lançado no portal da fábrica.</p>
      ${tabelaPedidos(novos, 'Nenhum pedido novo no momento.')}
    </div>

    <div class="painel">
      <h2>Histórico</h2>
      <p class="d">Tudo que já foi digitado, faturado ou cancelado.</p>
      ${tabelaPedidos(resto, 'Nada aqui ainda.')}
    </div>`;

  ligarPedidos();

  const bt = $('testar-email');
  if (bt) bt.onclick = async () => {
    bt.disabled = true; bt.textContent = 'enviando...';
    try {
      const d = await api('/api/admin/testar-email', { method: 'POST' });
      $('resultado-email').innerHTML = `<b style="color:var(--verde)">enviado para ${d.para.join(', ')}</b>`;
    } catch (e) {
      $('resultado-email').innerHTML = `<b style="color:var(--vermelho)">${esc(e.message)}</b>`;
    } finally {
      bt.disabled = false; bt.textContent = 'Enviar e-mail de teste';
    }
  };
}

function tabelaPedidos(lista, vazio) {
  if (!lista.length) return `<p style="color:var(--cinza);font-size:13px">${vazio}</p>`;
  return `<table><thead><tr>
      <th>Nº</th><th>Cliente</th><th>Quando</th><th>Condição</th>
      <th>Itens</th><th>Total</th><th>Status</th><th></th>
    </tr></thead><tbody>
    ${lista.map(p => `<tr>
      <td><b>${p.numero}</b></td>
      <td>${esc(p.razaoSocial)}<div style="font-size:11px;color:var(--cinza)">${esc(p.cnpj)}</div></td>
      <td>${data(p.createdAt)}</td>
      <td>${esc(p.condicaoRotulo)}${p.acrescimoPrazo ? `<div style="font-size:11px;color:var(--cinza)">+${(p.acrescimoPrazo*100).toFixed(2)}%</div>` : ''}</td>
      <td>${p.itens.length}<div style="font-size:11px;color:var(--cinza)">${p.pecas} peças</div></td>
      <td><b>${dinheiro(p.total)}</b>${p.totalProgramado>0?`<div style="font-size:11px;color:var(--azul)">${dinheiro(p.totalProgramado)} programado</div>`:''}</td>
      <td><span class="etiq ${p.status}">${p.status}</span></td>
      <td style="white-space:nowrap">
        <button class="acao" data-ver="${p.numero}">Ver</button>
        <a class="acao" href="/api/pedidos/${p.numero}/excel">Excel</a>
        <a class="acao" href="/api/pedidos/${p.numero}/pdf" target="_blank">PDF</a>
      </td>
    </tr>`).join('')}</tbody></table>`;
}

function ligarPedidos() {
  document.querySelectorAll('[data-ver]').forEach(b => {
    b.addEventListener('click', () => verPedido(b.dataset.ver));
  });
}

async function verPedido(numero) {
  const p = await api('/api/pedidos/' + numero);
  $('janela').innerHTML = `
    <h1>Pedido ${p.numero}</h1>
    <p class="sub">${esc(p.razaoSocial)} · ${esc(p.cnpj)} · ${data(p.createdAt)}</p>

    <div class="cartoes">
      <div class="cartao"><div class="r">Total</div><div class="v" style="font-size:20px">${dinheiro(p.total)}</div></div>
      <div class="cartao"><div class="r">Condição</div><div class="v" style="font-size:17px">${esc(p.condicaoRotulo)}</div></div>
      <div class="cartao"><div class="r">Frete</div><div class="v" style="font-size:17px">${esc(p.frete)}</div></div>
    </div>

    <table><thead><tr><th></th><th>Código</th><th>Produto</th><th>Qtd</th><th>Unit.</th><th>Total</th><th>Entrega</th></tr></thead>
    <tbody>${p.itens.map(i => `<tr>
      <td>${i.imagem?`<img src="/img/${i.imagem}" style="width:34px;height:34px;object-fit:contain">`:''}</td>
      <td style="font-size:12px">${esc(i.codigoOriginal||i.codigo)}</td>
      <td style="font-size:12.5px">${esc(i.nome)}</td>
      <td><b>${i.quantidade}</b></td>
      <td>${dinheiro(i.precoUnitario)}</td>
      <td><b>${dinheiro(i.total)}</b></td>
      <td style="font-size:11.5px;color:${i.natureza==='programado'?'var(--azul)':'var(--cinza)'}">
        ${i.natureza==='programado'?('Programado '+esc(i.mesChegada)):'Pronta entrega'}</td>
    </tr>`).join('')}</tbody></table>

    <div class="solto" style="margin-top:18px">
      <div class="campo"><label>Endereço</label><input value="${esc(p.endereco)}" readonly style="min-width:280px"></div>
      <div class="campo"><label>Transportadora</label><input value="${esc(p.transportadora)}" readonly></div>
      <div class="campo"><label>Vendedor</label><input value="${esc(p.vendedor)}" readonly></div>
    </div>
    ${p.observacoes?`<p style="font-size:13px"><b>Obs. do cliente:</b> ${esc(p.observacoes)}</p>`:''}

    <div class="solto">
      <div class="campo"><label>Status</label>
        <select id="v-status">
          ${['novo','digitado','faturado','cancelado'].map(s=>`<option${s===p.status?' selected':''}>${s}</option>`).join('')}
        </select></div>
      <div class="campo" style="flex:1"><label>Anotação interna</label>
        <input id="v-obs" value="${esc(p.observacaoInterna)}"></div>
      <button class="primaria" id="v-salvar">Salvar</button>
      <button class="acao" onclick="document.getElementById('tapa').classList.remove('aberto')">Fechar</button>
    </div>`;
  $('tapa').classList.add('aberto');
  $('v-salvar').onclick = async () => {
    await api('/api/pedidos/' + numero, {
      method:'PATCH', headers:{'content-type':'application/json'},
      body: JSON.stringify({ status: $('v-status').value, observacaoInterna: $('v-obs').value }),
    });
    fecharJanela(); abaPedidos();
  };
}

/* ============================ importação ========================== */
async function abaImportar() {
  const situacao = await api('/api/importacao/situacao');
  const historico = await api('/api/importacao/historico');
  const achar = (t) => situacao.bases.find(b => b.tipo === t);

  const quando = (t) => {
    const b = achar(t);
    return b ? data(b.atualizadoEm) : 'nunca';
  };

  const marcas = await api('/api/admin/marcas').catch(() => []);
  const temSamsonite = marcas.some(m => m.slug === 'samsonite');
  const temYins = marcas.some(m => m.slug === 'yins');

  // Bases guardadas de cada marca. A regra vale para todas: o arquivo que você
  // subiu por último continua valendo até você mesmo mandar substituir.
  const guardada = (marca, tipo) =>
    ((situacao.basesPorMarca || {})[marca] || []).find(b => b.tipo === tipo) || null;
  const resumoBase = (marca, tipo, unidade) => {
    const b = guardada(marca, tipo);
    return b ? `guardada em ${data(b.atualizadoEm)} · ${b.itens} ${unidade}` : 'nenhuma guardada ainda';
  };
  const contaMarca = (slug) => (situacao.porMarca || []).find(m => m.marca === slug) || { produtos:0, semFoto:0 };

  /**
   * Tabela do que está guardado em cada marca.
   *
   * Pedido do Marcelo: saber, de bate-pronto, qual foi o último catálogo
   * atualizado e quando. A informação já existia, mas espalhada numa linha
   * dentro de cada caixa de upload — para comparar três datas ele tinha que
   * varrer a tela inteira. Aqui é uma lista só, do mais recente para o mais
   * antigo.
   *
   * As marcas guardam coisas diferentes (a Maxprint tem três bases que se
   * cruzam, a Yin's tem uma tabela por catálogo), então a linha mostra o nome
   * do arquivo quando ele existe e o tipo da base quando não.
   */
  const ROTULO_BASE = {
    preco: 'Tabela de preço',
    estoque: 'Estoque',
    catalogo: 'Catálogo em PDF',
    catalogoModelos: 'Fichas por modelo',
    base: 'Base',
  };

  function linhasDeBase(marca) {
    const bases = (situacao.basesPorMarca || {})[marca] || [];
    const linhas = [];
    for (const b of bases) {
      const origens = Array.isArray(b.origem) ? b.origem : [];
      if (!origens.length) {
        linhas.push({ nome: ROTULO_BASE[b.tipo] || b.tipo, tipo: b.tipo, itens: b.itens, em: b.atualizadoEm });
        continue;
      }
      for (const o of origens) {
        // `em` só existe onde a importação é por catálogo (Yin's). Nas outras,
        // a data da base inteira é a data daquele arquivo.
        linhas.push({
          nome: o.titulo || o.arquivo || ROTULO_BASE[b.tipo] || b.tipo,
          tipo: b.tipo,
          itens: o.itens !== undefined ? o.itens : (o.produtos !== undefined ? o.produtos : b.itens),
          em: o.em || b.atualizadoEm,
        });
      }
    }
    return linhas.sort((a, b) => new Date(b.em) - new Date(a.em));
  }

  function tabelaDeBases(marca) {
    const linhas = linhasDeBase(marca);
    if (!linhas.length) {
      return '<p class="d" style="margin-top:14px">Nada guardado ainda nesta marca.</p>';
    }
    const agora = Date.now();
    return `
      <div style="border-top:1px solid var(--borda);margin:18px 0 12px"></div>

          const dias = Math.floor((agora - new Date(l.em)) / 86400000);

            <td style="font-size:12.5px">${esc(l.nome)}</td>

              <span style="color:var(--cinza);font-size:11px">${
                dias <= 0 ? ' · hoje' : dias === 1 ? ' · ontem' : ` · há ${dias} dias`}</span></td>

/**
 * Refaz o catálogo da Maxprint a partir das bases que já estão guardadas, sem
 * pedir arquivo nenhum. Existe porque a base fica salva e continua valendo até
 * chegar uma versão nova — mas, antes disso, o cruzamento só rodava dentro de
 * uma importação, e um catálogo esvaziado só voltava reenviando planilha.
 */
function ligarRecruzar() {
  const botao = $('b-recruzar');
  if (!botao) return;
  botao.onclick = async () => {
    botao.disabled = true;
    $('resultado-recruzar').innerHTML = '<div class="aviso">Refazendo o cruzamento...</div>';
    try {
      const { relatorio } = await api('/api/importacao/recruzar', { method: 'POST' });
      const r = relatorio || {};
      $('resultado-recruzar').innerHTML = `<div class="aviso">
        Catálogo refeito: <b>${r.ativos || 0} produtos da Maxprint no ar</b>
        (${r.comPrecoESaldo || 0} com preço e saldo, de ${r.precoTotal || 0} preços e
        ${r.estoqueTotal || 0} itens de estoque).
        ${r.aviso ? `<br><b>${esc(r.aviso)}</b>` : ''}
      </div>`;
      setTimeout(() => location.reload(), 2500);
    } catch (e) {
      $('resultado-recruzar').innerHTML = `<div class="aviso erro">${esc(e.message)}</div>`;
      botao.disabled = false;
    }
  };
}

function ligarBuscaDeFotos() {
  const botao = $('b-sam-fotos');
  if (!botao) return;
  botao.onclick = async () => {
    botao.disabled = true;
    $('resultado-sam-fotos').innerHTML = '<div class="aviso">Começando a varredura...</div>';
    try {
      const { tarefa } = await api('/api/importacao/samsonite/fotos', {
        method:'POST', headers:{'content-type':'application/json'},
        body: JSON.stringify({ soComSaldo: $('sam-fotos-escopo').value }) });
      acompanharFotos(tarefa);
    } catch (e) {
      $('resultado-sam-fotos').innerHTML = `<div class="aviso erro">${esc(e.message)}</div>`;
      botao.disabled = false;
    }
  };
}

/**
 * Faxina das fotos repetidas. Roda em dois tempos de propósito: primeiro
 * mostra o que seria apagado, e só apaga depois de você concordar. Apagar
 * foto de 800 itens sem avisar seria um susto grande demais.
 */
function ligarRevisarFotos() {
  const botao = $('b-sam-revisar');
  if (!botao) return;
  const alvo = $('resultado-sam-revisar');

  const chamar = (aplicar, incluirPagina) => api('/api/importacao/fotos/revisar?marca=samsonite', {
    method: 'POST', headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ aplicar: aplicar ? 'sim' : 'nao', incluirPagina: incluirPagina ? 'sim' : 'nao' }),
  });

  botao.onclick = async () => {
    botao.disabled = true;
    alvo.innerHTML = '<div class="aviso">Conferindo as fotos...</div>';
    try {
      const { relatorio, amostra } = await chamar(false);
      if (!relatorio.produtosSuspeitos) {
        alvo.innerHTML = '<div class="aviso">Nenhuma foto repetida. Cada item tem a sua.</div>';
        botao.disabled = false;
        return;
      }
      alvo.innerHTML = `<div class="aviso">
        <b>${relatorio.produtosSuspeitos} itens</b> compartilham foto, em
        ${relatorio.gruposRepetidos} grupos (de ${relatorio.comFoto} itens com imagem hoje).
        <div style="font-size:12px;color:var(--cinza);margin:8px 0">
          ${(amostra||[]).slice(0,5).map(g => `${esc(g.motivo)}: ${esc(g.codigos.slice(0,5).join(', '))}`).join('<br>')}
        </div>
        ${relatorio.comPaginaIlustrativa ? `<label style="display:block;font-size:12.5px;margin-bottom:9px">
          <input type="checkbox" id="c-sam-pagina"> apagar também as
          <b>${relatorio.comPaginaIlustrativa}</b> fotos de página do catálogo
          (aquelas que saem com o aviso "foto ilustrativa da linha")</label>` : ''}
        <button class="primaria" id="b-sam-revisar-ok">Apagar essas fotos</button>
        <button id="b-sam-revisar-nao">Deixar como está</button>
      </div>`;
      $('b-sam-revisar-nao').onclick = () => { alvo.innerHTML = ''; botao.disabled = false; };
      $('b-sam-revisar-ok').onclick = async () => {
        const comPagina = !!($('c-sam-pagina') && $('c-sam-pagina').checked);
        alvo.innerHTML = '<div class="aviso">Apagando...</div>';
        try {
          const { relatorio: r } = await chamar(true, comPagina);
          alvo.innerHTML = `<div class="aviso">
            <b>${r.fotosLimpas} fotos apagadas${r.paginasLimpas ? ` e ${r.paginasLimpas} fotos de página` : ''}.</b>
            Agora são ${r.semFotoAgora} itens sem imagem.
            O próximo "Buscar fotos" procura a foto certa de cada um; o que a loja não tiver,
            você anexa à mão.</div>`;
          setTimeout(() => location.reload(), 3500);
        } catch (e) {
          alvo.innerHTML = `<div class="aviso erro">${esc(e.message)}</div>`;
          botao.disabled = false;
        }
      };
    } catch (e) {
      alvo.innerHTML = `<div class="aviso erro">${esc(e.message)}</div>`;
      botao.disabled = false;
    }
  };
}

/** Mesma ideia do acompanhamento da importação: pergunta de tempos em tempos. */
async function acompanharFotos(id) {
  const alvo = $('resultado-sam-fotos');
  if (!alvo) return;

  let t;
  try { t = await api('/api/importacao/samsonite/status/' + id); }
  catch (e) { alvo.innerHTML = `<div class="aviso erro">${esc(e.message)}</div>`; return; }

  if (t.estado === 'rodando') {
    alvo.innerHTML = `<div class="aviso">
      <b>Buscando fotos...</b> ${esc(t.etapa)}
      <div style="background:#E5E5E7;border-radius:20px;height:7px;margin-top:9px;overflow:hidden">
        <div style="background:var(--laranja);height:100%;width:${t.progresso||0}%;transition:width .4s"></div>
      </div>
      <div style="font-size:11.5px;color:var(--cinza);margin-top:6px">
        Pode sair desta tela; a busca continua no servidor.</div>
    </div>`;
    setTimeout(() => acompanharFotos(id), 5000);
    return;
  }

  if (t.estado === 'erro') {
    alvo.innerHTML = `<div class="aviso erro"><b>A busca falhou.</b><br>${esc(t.erro)}</div>`;
    const b = $('b-sam-fotos'); if (b) b.disabled = false;
    return;
  }

  const r = t.relatorio || {};
  const linhas = [
    ['Produtos sem foto ao começar', r.procurados],
    ['Páginas de produto visitadas', r.paginasVisitadas],
    ['Fotos encontradas pelo código', r.fotosEncontradas],
    ['Fotos baixadas e guardadas', r.fotosBaixadas],
    ['Falhas ao baixar', r.falhasAoBaixar],
    ['Ainda sem foto', r.aindaSemFoto],
  ].filter(l => l[1] !== undefined);

  alvo.innerHTML = `<div class="aviso ok">
      <b>Busca concluída.</b>
      <table style="margin-top:10px">${linhas.map(l =>
        `<tr><td style="border:0;padding:3px 0">${l[0]}</td>
             <td style="border:0;padding:3px 0;text-align:right"><b>${l[1]}</b></td></tr>`).join('')}</table>
      ${(r.lojas||[]).length ? `<div style="margin-top:8px;font-size:12px">Lojas consultadas: ${r.lojas.map(esc).join(' · ')}</div>` : ''}
    </div>
    ${(t.avisos||[]).length ? `<div class="aviso"><b>${t.avisos.length} avisos:</b><br>
      ${t.avisos.slice(0,12).map(esc).join('<br>')}
      ${t.avisos.length>12?`<br>e mais ${t.avisos.length-12}.`:''}</div>` : ''}`;
  const b = $('b-sam-fotos'); if (b) b.disabled = false;
}

/** A planilha de estoque é rápida, então dispara ao escolher o arquivo. */
function ligarEstoqueSamsonite() {
  const input = $('f-sam-estoque');
  if (!input) return;
  input.addEventListener('change', async () => {
    if (!input.files.length) return;
    const fd = new FormData();
    for (const f of input.files) fd.append('arquivos', f);
    $('a-sam-estoque').textContent = input.files[0].name;
    $('resultado-sam-estoque').innerHTML = '<div class="aviso">Lendo a planilha e atualizando o catálogo...</div>';
    try {
      const d = await api('/api/importacao/samsonite/estoque', { method:'POST', body: fd });
      $('resultado-sam-estoque').innerHTML = relatorioEstoqueSamsoniteHtml(d);
      abaImportar();
    } catch (e) {
      $('resultado-sam-estoque').innerHTML = `<div class="aviso erro">${esc(e.message)}</div>`;
    }
  });
}

function relatorioEstoqueSamsoniteHtml(d) {
  const r = d.relatorio || {};
  const linhas = [
    ['Itens lidos na planilha', r.totalValido],
    ['Com saldo hoje', r.comSaldo],

    ['Atualizados', r.atualizados],
    ['Cadastrados agora (não estavam no catálogo)', r.criados],
    ['Com promoção preservada (preço não mexido)', r.promoPreservada],
    ['Zerados por sumir da planilha', r.zeradosPorSumirDaPlanilha],
    ['Grupos de cor', r.gruposDeCor],
    ['Total no catálogo da Samsonite', r.totalNoCatalogo],
  ].filter(l => l[1] !== undefined);

      ${porSub.length ? `<div style="margin-top:10px;font-size:12px">

/**
 * A Samsonite tem botão próprio (em vez de disparar na hora que escolhe o
 * arquivo, como a Maxprint) porque são dois campos que precisam ser
 * escolhidos antes de começar — e porque a importação demora, então começar
 * sem querer custaria caro.
 */
function ligarImportSamsonite() {
  const base = $('f-sam-base'), pdfs = $('f-sam-pdfs'), botao = $('b-sam-importar');
  const rotuloBase = $('a-sam-base').textContent;
  const rotuloPdfs = $('a-sam-pdfs').textContent;
  // Com base guardada, o arquivo deixa de ser obrigatório: subir de novo passa
  // a ser escolha ("quero substituir"), não exigência para poder importar.
  const temGuardada = /guardada em/.test(rotuloBase);

  const conferir = () => {
    $('a-sam-base').textContent = base.files.length ? base.files[0].name + ' (vai substituir)' : rotuloBase;
    $('a-sam-pdfs').textContent = pdfs.files.length ? pdfs.files.length + ' PDF(s) (vão substituir)' : rotuloPdfs;
    botao.disabled = !base.files.length && !temGuardada;
  };
  base.addEventListener('change', conferir);
  pdfs.addEventListener('change', conferir);

  botao.onclick = async () => {
    const fd = new FormData();
    if (base.files.length) fd.append('base', base.files[0]);
    for (const f of pdfs.files) fd.append('pdfs', f);

    botao.disabled = true;
    $('resultado-sam').innerHTML = '<div class="aviso">Enviando os arquivos...</div>';

    try {
      const { tarefa } = await api('/api/importacao/samsonite', { method:'POST', body: fd });
      acompanharSamsonite(tarefa);
    } catch (e) {
      $('resultado-sam').innerHTML = `<div class="aviso erro">${esc(e.message)}</div>`;
      botao.disabled = false;
    }
  };
}

/**
 * Importação da Yin's: sobe os catálogos em PDF e acompanha a leitura.
 *
 * A leitura é demorada de propósito — cada página é conferida contra a imagem
 * renderizada para descartar preço e código invisíveis. Por isso roda em
 * segundo plano, com a mesma barra de andamento das outras marcas.
 */
function ligarImportYins() {
  const campo = $('f-yins'), botao = $('b-yins');
  if (!campo || !botao) return;
  const rotulo = $('a-yins').textContent;

  // O tamanho aparece na hora. Sete catálogos passam de 150 MB, e mandar tudo
  // de uma vez depende de o upload aguentar o caminho inteiro — melhor avisar
  // antes do que descobrir depois de esperar.
  const LIMITE_MB = 100;
  campo.addEventListener('change', () => {
    const mb = [...campo.files].reduce((a, f) => a + f.size, 0) / 1024 / 1024;
    $('a-yins').textContent = campo.files.length
      ? `${campo.files.length} PDF(s) · ${mb.toFixed(0)} MB`
        + (mb > LIMITE_MB ? ' — é muito para um envio só, mande 2 ou 3 por vez' : ' — vão substituir essas tabelas')
      : rotulo;
    $('a-yins').style.color = mb > LIMITE_MB ? 'var(--vermelho)' : '';
    botao.disabled = !campo.files.length;
  });

  botao.onclick = async () => {
    const fd = new FormData();
    for (const f of campo.files) fd.append('pdfs', f);
    botao.disabled = true;
    $('resultado-yins').innerHTML = '<div class="aviso">Enviando os catálogos...</div>';
    try {
      const { tarefa } = await api('/api/importacao/yins', { method: 'POST', body: fd });
      acompanharYins(tarefa);
    } catch (e) {
      $('resultado-yins').innerHTML = `<div class="aviso erro">${esc(e.message)}</div>`;
      botao.disabled = false;
    }
  };

  const refazer = $('b-yins-recruzar');
  if (refazer) refazer.onclick = async () => {
    refazer.disabled = true;
    $('resultado-yins-recruzar').innerHTML = '<div class="aviso">Refazendo o catálogo...</div>';
    try {
      const { relatorio } = await api('/api/importacao/yins/recruzar', { method: 'POST' });
      $('resultado-yins-recruzar').innerHTML = `<div class="aviso">
        Catálogo refeito: <b>${relatorio.ativos} itens no ar</b>, ${relatorio.comFoto} com foto.</div>`;
      setTimeout(() => location.reload(), 2500);
    } catch (e) {
      $('resultado-yins-recruzar').innerHTML = `<div class="aviso erro">${esc(e.message)}</div>`;
      refazer.disabled = false;
    }
  };
}

async function acompanharYins(id) {
  const alvo = $('resultado-yins');
  if (!alvo) return;
  let t;
  try { t = await api('/api/importacao/samsonite/status/' + id); }
  catch (e) { alvo.innerHTML = `<div class="aviso erro">${esc(e.message)}</div>`; return; }

  if (t.estado === 'rodando') {
    alvo.innerHTML = `<div class="aviso">
      <b>Lendo os catálogos da Yin's...</b> ${esc(t.etapa)}
      <div style="background:#E5E5E7;border-radius:20px;height:7px;margin-top:9px;overflow:hidden">
        <div style="background:var(--laranja);height:100%;width:${t.progresso||0}%;transition:width .4s"></div>
      </div>
      <div style="font-size:11.5px;color:var(--cinza);margin-top:6px">
        Pode sair desta tela; a leitura continua no servidor.</div></div>`;
    setTimeout(() => acompanharYins(id), 3000);
    return;
  }
  if (t.estado === 'erro') {
    alvo.innerHTML = `<div class="aviso erro"><b>A leitura falhou.</b><br>${esc(t.erro)}</div>`;
    const b = $('b-yins'); if (b) b.disabled = false;
    return;
  }

  const r = t.relatorio || {};
  const sit = Object.entries(r.porSituacao || {}).map(([k, v]) => `${v} ${k.toLowerCase()}`).join(' · ');
  alvo.innerHTML = `<div class="aviso">
    <b>${r.total || 0} itens lidos</b> em ${r.catalogos || 0} catálogos e ${r.segmentos || 0} seções.<br>
    ${r.comFoto || 0} com foto · ${r.semFoto || 0} sem foto · ${r.semPreco || 0} sem preço legível.<br>
    ${sit ? `Situação: ${esc(sit)}.<br>` : ''}
    ${r.desativados ? `${r.desativados} itens saíram do ar por não estarem mais nos catálogos.<br>` : ''}
    ${(t.avisos || []).length ? `<div style="font-size:11.5px;color:var(--cinza);margin-top:8px">
      ${t.avisos.slice(0, 8).map(esc).join('<br>')}</div>` : ''}
  </div>`;
  setTimeout(() => location.reload(), 4000);
}

/**
 * Refaz o catálogo da Samsonite com o que já está guardado. Mesma tarefa em
 * segundo plano da importação, e por isso o mesmo acompanhamento.
 */
function ligarRecruzarSamsonite() {
  const botao = $('b-sam-recruzar');
  if (!botao) return;
  botao.onclick = async () => {
    botao.disabled = true;
    $('resultado-sam-recruzar').innerHTML = '<div class="aviso">Refazendo o catálogo com as bases guardadas...</div>';
    try {
      const { tarefa } = await api('/api/importacao/samsonite/recruzar', { method: 'POST' });
      acompanharSamsonite(tarefa, 'resultado-sam-recruzar', botao);
    } catch (e) {
      $('resultado-sam-recruzar').innerHTML = `<div class="aviso erro">${esc(e.message)}</div>`;
      botao.disabled = false;
    }
  };
}

/**
 * A importação roda no servidor em segundo plano; aqui só pergunto de tempos
 * em tempos como está. Sem isso a conexão morreria no meio da leitura dos
 * PDFs, que passa de vários minutos.
 */
async function acompanharSamsonite(id, ondeEscrever, botaoDeVolta) {
  const alvo = $(ondeEscrever || 'resultado-sam');
  if (!alvo) return; // o admin trocou de aba, não tem mais onde escrever

  let t;
  try {
    t = await api('/api/importacao/samsonite/status/' + id);
  } catch (e) {
    alvo.innerHTML = `<div class="aviso erro">${esc(e.message)}</div>`;
    return;
  }

  if (t.estado === 'rodando') {
    alvo.innerHTML = `<div class="aviso">
      <b>Importando a Samsonite...</b> ${esc(t.etapa)}
      <div style="background:#E5E5E7;border-radius:20px;height:7px;margin-top:9px;overflow:hidden">
        <div style="background:var(--laranja);height:100%;width:${t.progresso||0}%;transition:width .4s"></div>
      </div>
      <div style="font-size:11.5px;color:var(--cinza);margin-top:6px">
        Pode sair desta tela; a importação continua no servidor.</div>
    </div>`;
    setTimeout(() => acompanharSamsonite(id, ondeEscrever, botaoDeVolta), 3000);
    return;
  }

  if (t.estado === 'erro') {
    alvo.innerHTML = `<div class="aviso erro"><b>A importação falhou.</b><br>${esc(t.erro)}</div>`;
    const b = botaoDeVolta || $('b-sam-importar'); if (b) b.disabled = false;
    return;
  }

  alvo.innerHTML = relatorioSamsoniteHtml(t);
}

function relatorioSamsoniteHtml(t) {

  const cruz = r.cruzamentoFotos || null;
  const linhas = [

        <div style="margin-top:8px;font-size:12px">Nenhum PDF enviado, então os produtos ficaram sem foto.</div>`}
    </div>
    ${(t.avisos||[]).length ? `<div class="aviso"><b>${t.avisos.length} avisos:</b><br>
      ${t.avisos.slice(0,10).map(esc).join('<br>')}
      ${t.avisos.length>10?`<br>e mais ${t.avisos.length-10}.`:''}</div>` : ''}`;

function ligarImport(tipo) {
  const input = $('f-' + tipo);
  input.addEventListener('change', async () => {
    if (!input.files.length) return;
    const fd = new FormData();
    for (const f of input.files) fd.append('arquivos', f);
    $('a-' + tipo).textContent = 'enviando ' + input.files.length + ' arquivo(s)...';
    $('resultado').innerHTML = `<div class="aviso">Lendo os arquivos. Catálogo grande leva um minuto, porque cada foto é recortada da página.</div>`;
    try {
      const d = await api('/api/importacao/' + tipo, { method:'POST', body: fd });
      $('resultado').innerHTML = relatorioHtml(d);
      abaImportar();
    } catch (e) {
      $('resultado').innerHTML = `<div class="aviso erro">${esc(e.message)}</div>`;
      $('a-' + tipo).textContent = 'falhou';
    }
  });
}

function relatorioHtml(d) {

  const linhas = [
    ['Produtos no catálogo do cliente', r.total],
    ['Com saldo hoje', r.disponiveis],
    ['Só programados (sem saldo, com chegada prevista)', r.programados],
    ['Com foto', r.comFoto],
    ['Foto casada por modelo', r.fotoPorModelo],
    ['Foto ilustrativa da linha', r.fotoIlustrativa],
    ['Fora por falta de preço', (r.semPreco||[]).length],

  ].filter(l => l[1] !== undefined);

  return `<div class="aviso ok">
      <b>Importação concluída.</b>
      <table style="margin-top:10px">${linhas.map(l =>
        `<tr><td style="border:0;padding:3px 0">${l[0]}</td>

      ${(r.porArquivo||[]).length ? `<div style="margin-top:10px;font-size:12px">
        ${r.porArquivo.map(a => `<div>${esc(a.arquivo)}: ${a.codigos ?? a.itens ?? 0} itens
          ${a.comFoto!==undefined?`· ${a.comFoto} com foto`:''}
          ${a.abasIgnoradas?`· ${a.abasIgnoradas} aba(s) ignorada(s)`:''}</div>`).join('')}
      </div>` : ''}

        <b>${semPreco.length} itens com saldo ficaram de fora por não terem preço:</b><br>
        ${semPreco.slice(0,12).map(x => esc(x.codigo)+' '+esc((x.descricao||'').slice(0,40))).join('<br>')}

      </div>` : ''}

      ${d.avisos.slice(0,10).map(esc).join('<br>')}

}

/* ============================= clientes =========================== */
let MARCAS = []; // preenchido em abaClientes/abaMarcas, usado no formulário do cliente

async function abaClientes() {
  const [lista, marcas] = await Promise.all([
    api('/api/admin/usuarios'),
    api('/api/admin/marcas').catch(() => []),
  ]);
  MARCAS = marcas;
  const clientes = lista.filter(u => u.perfil === 'cliente');
  const equipe = lista.filter(u => u.perfil !== 'cliente');
  const nomeMarca = (slug) => (marcas.find(m => m.slug === slug) || {}).nome || slug;

  $('aba-clientes').innerHTML = `
    <h1>Clientes e acessos</h1>
    <p class="sub">Você cria o login e passa a senha. Não existe autocadastro.</p>

    <div class="painel">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
        <div><h2>Clientes</h2><p class="d" style="margin:0">O catálogo só abre quando você liberar.</p></div>
        <button class="primaria" id="novo-cliente">Novo cliente</button>
      </div>
      ${!clientes.length ? '<p style="color:var(--cinza);font-size:13px">Nenhum cliente cadastrado.</p>' : `
      <table><thead><tr>
        <th>Cliente</th><th>Usuário</th><th>Marcas</th><th>Desconto</th><th>Catálogo</th>
        <th>Outlet</th><th>Programado</th><th>Último acesso</th><th></th>
      </tr></thead><tbody>
      ${clientes.map(c => `<tr>
        <td><b>${esc(c.nome)}</b><div style="font-size:11px;color:var(--cinza)">${esc(c.razaoSocial||'')} ${esc(c.cnpj||'')}</div></td>
        <td><span class="senha">${esc(c.usuario)}</span></td>
        <td style="font-size:12px">${(c.marcasPermitidas||['maxprint']).map(s => esc(nomeMarca(s))).join(', ')}</td>
        <td><b>${(c.desconto*100).toFixed(1)}%</b></td>
        <td><span class="etiq ${c.catalogoStatus==='live'?'faturado':'cancelado'}">${c.catalogoStatus}</span></td>
        <td>${c.verOutlet?'sim':'não'}</td>
        <td>${c.permitirProgramado?'sim':'não'}</td>
        <td style="font-size:12px">${c.ultimoAcesso?data(c.ultimoAcesso):'nunca'}</td>
        <td style="white-space:nowrap">
          <button class="acao" data-editar="${c._id}">Editar</button>
          <button class="acao" data-senha="${c._id}">Nova senha</button>
          <button class="acao" data-liberar="${c._id}" data-atual="${c.catalogoStatus}">
            ${c.catalogoStatus==='live'?'Travar':'Liberar'}</button>
        </td>
      </tr>`).join('')}</tbody></table>`}
    </div>

    <div class="painel">
      <h2>Equipe</h2>
      <p class="d">Quem enxerga o painel. Admin mexe em tudo, interno só acompanha.</p>
      <table><thead><tr><th>Nome</th><th>Usuário</th><th>Perfil</th><th>Último acesso</th></tr></thead>
      <tbody>${equipe.map(u => `<tr>
        <td>${esc(u.nome)}</td><td><span class="senha">${esc(u.usuario)}</span></td>
        <td>${esc(u.perfil)}</td><td style="font-size:12px">${u.ultimoAcesso?data(u.ultimoAcesso):'nunca'}</td>
      </tr>`).join('')}</tbody></table>

  $('novo-cliente').onclick = () => formCliente(null);

  document.querySelectorAll('[data-senha]').forEach(b =>
    b.onclick = () => formSenha(clientes.find(c => c._id === b.dataset.senha)));
  document.querySelectorAll('[data-liberar]').forEach(b =>
    b.onclick = async () => {

      abaClientes();
    });

/**
 * Trocar a senha de um cliente.
 *
 * Antes isso era um botão que sorteava uma senha e mostrava num alert. Agora
 * dá para escolher a senha — que é o que acontece na prática quando o cliente
 * liga pedindo para trocar e quer uma que ele consiga lembrar. O sorteio
 * continua ali, num botão, para quando não houver preferência.
 */
function formSenha(c) {
  if (!c) return;
  $('janela').innerHTML = `
    <h1>Nova senha</h1>
    <p class="sub">${esc(c.nome)} · usuário <span class="senha">${esc(c.usuario)}</span></p>
    <div class="campos">
      <div class="campo cheio"><label>Senha nova (mínimo 6 caracteres)</label>
        <input id="s-nova" autocomplete="off" placeholder="deixe em branco para sortear uma"></div>
    </div>
    <div class="solto" style="margin-top:8px">
      <button class="acao" id="s-sortear">Sortear uma senha</button>
    </div>
    <div id="s-erro" class="aviso erro" style="display:none"></div>
    <div class="solto" style="margin-top:12px;justify-content:flex-end">
      <button class="acao" onclick="document.getElementById('tapa').classList.remove('aberto')">Cancelar</button>
      <button class="primaria" id="s-salvar">Trocar a senha</button>
    </div>`;
  $('tapa').classList.add('aberto');

  $('s-sortear').onclick = async () => {
    const d = await api('/api/admin/senha-sugerida');
    $('s-nova').value = d.senha;
  };

  $('s-salvar').onclick = async () => {
    const senha = $('s-nova').value.trim();
    if (senha && senha.length < 6) {
      $('s-erro').textContent = 'A senha precisa de pelo menos 6 caracteres.';
      $('s-erro').style.display = 'block';
      return;
    }
    try {
      const d = await api('/api/admin/usuarios/' + c._id + '/senha', {
        method:'POST', headers:{'content-type':'application/json'},
        body: JSON.stringify(senha ? { senha } : {}) });
      $('janela').innerHTML = `
        <h1>Senha trocada</h1>
        <p class="sub">Mande estes dados para o cliente. A senha não aparece de novo.</p>
        <div class="painel">
          <p>Endereço: <span class="senha">${location.origin}/login</span></p>
          <p>Usuário: <span class="senha">${esc(c.usuario)}</span></p>
          <p>Senha: <span class="senha">${esc(d.senha)}</span></p>
        </div>
        <div class="solto" style="justify-content:flex-end">
          <button class="primaria" onclick="document.getElementById('tapa').classList.remove('aberto')">Pronto</button>
        </div>`;
    } catch (e) {
      $('s-erro').textContent = e.message; $('s-erro').style.display = 'block';
    }
  };
}

function formCliente(c) {
  const novo = !c;
  c = c || { desconto:0, catalogoStatus:'travado', verOutlet:true, permitirProgramado:true };
  const permitidas = (c.marcasPermitidas && c.marcasPermitidas.length) ? c.marcasPermitidas : ['maxprint'];
  $('janela').innerHTML = `
    <h1>${novo ? 'Novo cliente' : 'Editar cliente'}</h1>
    <p class="sub">O desconto fica só aqui. O cliente vê o preço já com ele aplicado.</p>
    <div class="campos">
      <div class="campo"><label>Nome de contato *</label><input id="c-nome" value="${esc(c.nome||'')}"></div>
      <div class="campo"><label>Usuário (login) *</label>
        <input id="c-usuario" value="${esc(c.usuario||'')}" ${novo?'':'readonly'}></div>
      <div class="campo cheio"><label>Razão social</label><input id="c-razao" value="${esc(c.razaoSocial||'')}"></div>
      <div class="campo"><label>CNPJ</label><input id="c-cnpj" value="${esc(c.cnpj||'')}"></div>
      <div class="campo"><label>Telefone</label><input id="c-tel" value="${esc(c.telefone||'')}"></div>
      <div class="campo cheio"><label>Endereço de entrega</label><input id="c-end" value="${esc(c.endereco||'')}"></div>
      <div class="campo"><label>Transportadora padrão</label><input id="c-transp" value="${esc(c.transportadora||'')}"></div>
      <div class="campo"><label>Vendedor</label><input id="c-vend" value="${esc(c.vendedor||'')}"></div>
      <div class="campo"><label>E-mail</label><input id="c-email" value="${esc(c.email||'')}"></div>
      <div class="campo"><label>Desconto (%) *</label>
        <input id="c-desc" type="number" step="0.1" min="0" max="95" value="${((c.desconto||0)*100).toFixed(1)}"></div>
      <div class="campo"><label>Catálogo</label>
        <select id="c-status">
          <option value="travado"${c.catalogoStatus==='travado'?' selected':''}>Travado</option>
          <option value="live"${c.catalogoStatus==='live'?' selected':''}>Liberado</option>
        </select></div>
      <div class="campo"><label>Ver outlet</label>
        <select id="c-outlet"><option value="sim"${c.verOutlet!==false?' selected':''}>Sim</option>
        <option value="nao"${c.verOutlet===false?' selected':''}>Não</option></select></div>
      <div class="campo"><label>Pode pedir programado</label>
        <select id="c-prog"><option value="sim"${c.permitirProgramado!==false?' selected':''}>Sim</option>
        <option value="nao"${c.permitirProgramado===false?' selected':''}>Não</option></select></div>
      <div class="campo cheio"><label>Marcas que este cliente enxerga *</label>
        <div class="marcas-escolha">
          ${(MARCAS.length ? MARCAS : [{slug:'maxprint',nome:'Maxprint',corPrimaria:'#EB8704'}])
            .map(m => `<label class="marca-op">
              <input type="checkbox" class="c-marca" value="${esc(m.slug)}"
                ${(permitidas.includes(m.slug)) ? 'checked' : ''}>
              <span class="ponto" style="background:${esc(m.corPrimaria||'#888')}"></span>
              ${esc(m.nome)}
            </label>`).join('')}
        </div>
        <div style="font-size:11.5px;color:var(--cinza);margin-top:6px">
          Cada marca vira uma aba no catálogo dele. Sem nenhuma marcada, fica só a Maxprint.</div>
      </div>
    </div>
    <div id="c-erro" class="aviso erro" style="display:none"></div>
    <div class="solto" style="margin-top:16px;justify-content:flex-end">
      <button class="acao" onclick="document.getElementById('tapa').classList.remove('aberto')">Cancelar</button>
      <button class="primaria" id="c-salvar">${novo?'Criar e gerar senha':'Salvar'}</button>
    </div>`;
  $('tapa').classList.add('aberto');

  $('c-salvar').onclick = async () => {
    const corpo = {
      nome: $('c-nome').value.trim(),
      usuario: $('c-usuario').value.trim(),
      razaoSocial: $('c-razao').value.trim(),
      cnpj: $('c-cnpj').value.trim(),
      telefone: $('c-tel').value.trim(),
      endereco: $('c-end').value.trim(),
      transportadora: $('c-transp').value.trim(),
      vendedor: $('c-vend').value.trim(),
      email: $('c-email').value.trim(),
      desconto: Number($('c-desc').value || 0) / 100,
      catalogoStatus: $('c-status').value,
      verOutlet: $('c-outlet').value === 'sim',
      permitirProgramado: $('c-prog').value === 'sim',
      marcasPermitidas: [...document.querySelectorAll('.c-marca:checked')].map(i => i.value),
      perfil: 'cliente',
    };
    try {
      if (novo) {
        const d = await api('/api/admin/usuarios', {
          method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify(corpo) });
        $('janela').innerHTML = `
          <h1>Cliente criado</h1>
          <p class="sub">Mande estes dados para ele. A senha não aparece de novo.</p>
          <div class="painel">
            <p>Endereço: <span class="senha">${location.origin}/login</span></p>
            <p>Usuário: <span class="senha">${esc(d.usuario)}</span></p>
            <p>Senha: <span class="senha">${esc(d.senha)}</span></p>
          </div>
          <div class="aviso">O catálogo dele está <b>travado</b>. Confira a base e o desconto, depois use o botão Liberar.</div>
          <div class="solto" style="justify-content:flex-end">
            <button class="primaria" onclick="document.getElementById('tapa').classList.remove('aberto');abaClientes()">Pronto</button>
          </div>`;
      } else {
        await api('/api/admin/usuarios/' + c._id, {
          method:'PATCH', headers:{'content-type':'application/json'}, body: JSON.stringify(corpo) });
        fecharJanela(); abaClientes();
      }
    } catch (e) {
      $('c-erro').textContent = e.message; $('c-erro').style.display = 'block';
    }
  };
}

/* ============================= produtos =========================== */
async function abaProdutos(q = '', semFoto = false, marca = '') {
  const [lista, marcas] = await Promise.all([
    api(`/api/admin/produtos?q=${encodeURIComponent(q)}&semFoto=${semFoto?'sim':'nao'}&marca=${encodeURIComponent(marca)}`),
    api('/api/admin/marcas').catch(() => []),
  ]);

  $('aba-produtos').innerHTML = `
    <h1>Produtos e fotos</h1>
    <p class="sub">Aqui você confere o que o cliente vê e anexa foto no que o catálogo não ilustra.</p>
    <div class="painel">
      <div class="solto">
        <div class="campo" style="flex:1;min-width:180px"><label>Buscar</label>
          <input id="p-busca" value="${esc(q)}" placeholder="código, nome, cor ou linha"></div>
        ${marcas.length > 1 ? `<div class="campo"><label>Marca</label>
          <select id="p-marca">
            <option value="">Todas</option>
            ${marcas.map(m => `<option value="${esc(m.slug)}"${marca===m.slug?' selected':''}>${esc(m.nome)}</option>`).join('')}
          </select></div>` : ''}
        <button class="acao" id="p-todos" style="padding:9px 14px">Todos</button>
        <button class="acao" id="p-semfoto" style="padding:9px 14px">Só sem foto</button>
      </div>
      <div class="rolagem">
      <table><thead><tr>
        <th>Foto</th><th>Código</th><th>Produto</th><th>Categoria</th>
        <th>Preço tabela</th><th>Estoque</th><th>Status</th><th></th>
      </tr></thead><tbody>
      ${lista.map(p => `<tr>
        <td>${(p.imagemManual||p.imagem)
          ? `<img src="/img/${p.imagemManual||p.imagem}" style="width:38px;height:38px;object-fit:contain">`
          : `<div style="width:38px;height:38px;background:var(--claro);border-radius:6px"></div>`}</td>
        <td style="font-size:12px">${esc(p.codigoOriginal||p.codigo)}</td>
        <td style="font-size:12.5px">${esc(p.nome)}
          ${p.cor?`<div style="font-size:10.5px;color:var(--cinza)">${esc(p.cor)}</div>`:''}
          ${p.imagemIlustrativa && !p.imagemManual ? '<div style="font-size:10.5px;color:var(--cinza)">foto ilustrativa da linha</div>':''}</td>
        <td style="font-size:12px">${esc(p.categoria)}</td>
        <td>${dinheiro(p.precoBase)}</td>
        <td><b>${(p.estoque||0).toLocaleString('pt-BR')}</b>
          ${p.previstoTotal?`<div style="font-size:11px;color:var(--azul)">+${p.previstoTotal} previsto</div>`:''}</td>
        <td style="font-size:11.5px">${esc(p.status)}</td>
        <td><label class="acao" style="cursor:pointer">Trocar foto
          <input type="file" accept="image/*" style="display:none"
                 data-foto="${p.codigo}" data-marca="${esc(p.marcaSlug||'maxprint')}"></label></td>
      </tr>`).join('')}</tbody></table>
      </div>
      ${!lista.length?'<p style="color:var(--cinza);font-size:13px">Nada encontrado.</p>':''}
    </div>`;

  $('p-busca').addEventListener('keydown', (e) => { if (e.key==='Enter') abaProdutos(e.target.value, semFoto, marca); });
  if ($('p-marca')) $('p-marca').onchange = (e) => abaProdutos(q, semFoto, e.target.value);
  $('p-todos').onclick = () => abaProdutos('', false, marca);
  $('p-semfoto').onclick = () => abaProdutos('', true, marca);
  document.querySelectorAll('[data-foto]').forEach(inp => {
    inp.addEventListener('change', async () => {
      if (!inp.files.length) return;
      const fd = new FormData(); fd.append('imagem', inp.files[0]);
      // A marca vai junto porque o mesmo código pode existir em duas marcas.
      await api(`/api/importacao/foto/${inp.dataset.foto}?marca=${encodeURIComponent(inp.dataset.marca)}`,
        { method:'POST', body: fd });
      abaProdutos(q, semFoto, marca);
    });
  });
}

/* ============================== marcas ============================ */
async function abaMarcas() {
  const marcas = await api('/api/admin/marcas');
  MARCAS = marcas;

  const condicoesTexto = (lista) => (lista||[]).map(c => c.rotulo).join(', ') || '—';

  $('aba-marcas').innerHTML = `
    <h1>Marcas</h1>
    <p class="sub">Cada marca é uma aba no catálogo do cliente, com cor e regra de prazo próprias.</p>

    ${!marcas.length ? `<div class="aviso">Nenhuma marca cadastrada ainda.
      Rode <span class="senha">node scripts/seed_marcas.js</span> no servidor.</div>` : ''}

    ${marcas.map(m => `
      <div class="painel">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:4px">
          <span class="ponto" style="background:${esc(m.corPrimaria)};width:14px;height:14px"></span>
          <h2 style="margin:0">${esc(m.nome)}</h2>
          <span class="etiq ${m.ativa?'faturado':'cancelado'}">${m.ativa?'ativa':'desativada'}</span>
          <div style="flex:1"></div>
          <button class="acao" data-editar-marca="${esc(m.slug)}">Editar</button>
        </div>
        <p class="d">Endereço interno: <span class="senha">${esc(m.slug)}</span></p>
        <div class="cartoes" style="margin-bottom:0">
          <div class="cartao"><div class="r">Pedido mínimo</div>
            <div class="v" style="font-size:19px">${m.pedidoMinimo===null||m.pedidoMinimo===undefined?'usa o geral':dinheiro(m.pedidoMinimo)}</div></div>
          <div class="cartao"><div class="r">Frete CIF a partir de</div>
            <div class="v" style="font-size:19px">${m.valorFreteCif===null||m.valorFreteCif===undefined?'usa o geral':dinheiro(m.valorFreteCif)}</div></div>
          <div class="cartao"><div class="r">Prazo muda o preço?</div>
            <div class="v" style="font-size:19px">${m.aplicarAcrescimoPrazo?'sim':'não'}</div></div>
        </div>
        <table style="margin-top:12px">
          <tr><td style="border:0;padding:4px 0;color:var(--cinza)">Condições sempre disponíveis</td>
              <td style="border:0;padding:4px 0"><b>${esc(condicoesTexto(m.condicoesPagamento))}</b></td></tr>
          ${m.condicoesAcimaDeValor && m.condicoesAcimaDeValor.valorMinimo > 0 ? `
          <tr><td style="border:0;padding:4px 0;color:var(--cinza)">Liberadas acima de ${dinheiro(m.condicoesAcimaDeValor.valorMinimo)}</td>
              <td style="border:0;padding:4px 0"><b>${esc(condicoesTexto(m.condicoesAcimaDeValor.condicoes))}</b></td></tr>` : ''}
          ${(m.subMarcas||[]).length ? `
          <tr><td style="border:0;padding:4px 0;color:var(--cinza)">Sub-marcas</td>
              <td style="border:0;padding:4px 0">${m.subMarcas.map(s =>
                `<span class="marca-op" style="display:inline-flex;margin:2px 6px 2px 0">
                   <span class="ponto" style="background:${esc(s.cor)}"></span>${esc(s.nome)}</span>`).join('')}</td></tr>` : ''}
        </table>
      </div>`).join('')}`;

  document.querySelectorAll('[data-editar-marca]').forEach(b =>
    b.onclick = () => formMarca(marcas.find(m => m.slug === b.dataset.editarMarca)));
}

function formMarca(m) {
  $('janela').innerHTML = `
    <h1>Editar ${esc(m.nome)}</h1>
    <p class="sub">O que não se edita aqui (as condições de pagamento) é ajustado no código, porque mexe na conta do pedido.</p>
    <div class="campos">
      <div class="campo"><label>Nome</label><input id="m-nome" value="${esc(m.nome)}"></div>
      <div class="campo"><label>Ordem da aba</label><input id="m-ordem" type="number" value="${m.ordem||0}"></div>
      <div class="campo"><label>Cor principal</label>
        <input id="m-cor1" type="color" value="${esc(m.corPrimaria||'#000000')}" style="height:42px;padding:4px"></div>
      <div class="campo"><label>Cor secundária</label>
        <input id="m-cor2" type="color" value="${esc(m.corSecundaria||'#000000')}" style="height:42px;padding:4px"></div>
      <div class="campo"><label>Pedido mínimo (vazio = usa o geral)</label>
        <input id="m-min" type="number" step="0.01" value="${m.pedidoMinimo===null||m.pedidoMinimo===undefined?'':m.pedidoMinimo}"></div>
      <div class="campo"><label>Frete CIF a partir de (vazio = usa o geral)</label>
        <input id="m-cif" type="number" step="0.01" value="${m.valorFreteCif===null||m.valorFreteCif===undefined?'':m.valorFreteCif}"></div>
      <div class="campo"><label>Aba visível para clientes</label>
        <select id="m-ativa"><option value="sim"${m.ativa?' selected':''}>Sim</option>
        <option value="nao"${!m.ativa?' selected':''}>Não</option></select></div>
      <div class="campo"><label>E-mails de aviso (vazio = usa os gerais)</label>
        <input id="m-emails" value="${esc((m.emailsAviso||[]).join(', '))}" placeholder="um, outro"></div>
    </div>
    <div id="m-erro" class="aviso erro" style="display:none"></div>
    <div class="solto" style="margin-top:16px;justify-content:flex-end">
      <button class="acao" onclick="document.getElementById('tapa').classList.remove('aberto')">Cancelar</button>
      <button class="primaria" id="m-salvar">Salvar</button>
    </div>`;
  $('tapa').classList.add('aberto');

  $('m-salvar').onclick = async () => {
    // Campo vazio vira null de propósito: é assim que a marca diz "não tenho
    // regra própria, use a configuração geral do sistema".
    const numeroOuNulo = (v) => v.trim() === '' ? null : Number(v);
    try {
      await api('/api/admin/marcas/' + m.slug, {
        method:'PATCH', headers:{'content-type':'application/json'},
        body: JSON.stringify({
          nome: $('m-nome').value.trim(),
          ordem: Number($('m-ordem').value || 0),
          corPrimaria: $('m-cor1').value,
          corSecundaria: $('m-cor2').value,
          pedidoMinimo: numeroOuNulo($('m-min').value),
          valorFreteCif: numeroOuNulo($('m-cif').value),
          ativa: $('m-ativa').value === 'sim',
          emailsAviso: $('m-emails').value.split(',').map(s => s.trim()).filter(Boolean),
        }) });
      fecharJanela(); abaMarcas();
    } catch (e) {
      $('m-erro').textContent = e.message; $('m-erro').style.display = 'block';
    }
  };
}

/* ============================ relatórios ========================== */
async function abaRelatorios() {
  const [clientes, produtos, periodo] = await Promise.all([
    api('/api/admin/relatorio/clientes'),
    api('/api/admin/relatorio/produtos'),
    api('/api/admin/relatorio/periodo'),
  ]);

  const tabela = (titulo, desc, cabecalhos, linhas) => `
    <div class="painel"><h2>${titulo}</h2><p class="d">${desc}</p>
    ${!linhas.length?'<p style="color:var(--cinza);font-size:13px">Sem dados no período.</p>':`
    <table><thead><tr>${cabecalhos.map(c=>`<th>${c}</th>`).join('')}</tr></thead>
    <tbody>${linhas.join('')}</tbody></table>`}</div>`;

  $('aba-relatorios').innerHTML = `
    <h1>Relatórios</h1>
    <p class="sub">Últimos 90 dias, fora os pedidos cancelados.</p>
    <div class="grade-rel">
      ${tabela('Por cliente','Quem mais comprou.',['Cliente','Pedidos','Peças','Total'],
        clientes.map(c=>`<tr><td>${esc(c._id||'-')}</td><td>${c.pedidos}</td><td>${c.pecas}</td>
          <td><b>${dinheiro(c.total)}</b></td></tr>`))}
      ${tabela('Por produto','O que mais sai.',['Código','Produto','Peças','Total'],
        produtos.map(p=>`<tr><td style="font-size:12px">${esc(p.codigo)}</td>
          <td style="font-size:12.5px">${esc(p.nome)}</td><td>${p.pecas}</td>
          <td><b>${dinheiro(p.total)}</b></td></tr>`))}
    </div>
    ${tabela('Por mês','Evolução do faturamento pedido.',['Mês','Pedidos','Peças','Total'],
      periodo.map(p=>`<tr><td>${esc(p._id)}</td><td>${p.pedidos}</td><td>${p.pecas}</td>
        <td><b>${dinheiro(p.total)}</b></td></tr>`))}`;
}

/* =========================== configuração ========================= */

  const c = await api('/api/admin/config');
  $('aba-config').innerHTML = `
    <h1>Configuração</h1>
    <p class="sub">As regras que o sistema aplica. Mudança aqui vale na hora, sem mexer em código.</p>
    <div class="painel">
      <div class="campos">
        <div class="campo"><label>Pedido mínimo (R$)</label>
          <input id="k-min" type="number" step="0.01" value="${c.pedidoMinimo}"></div>
        <div class="campo"><label>Valor que aciona o frete CIF (R$)</label>
          <input id="k-cif" type="number" step="0.01" value="${c.valorFreteCif}"></div>
        <div class="campo"><label>Itens no ranking de cada categoria</label>
          <input id="k-rank" type="number" min="1" value="${c.itensRanking}"></div>
        <div class="campo"><label>Status do estoque que NÃO entram no catálogo</label>
          <input id="k-status" value="${(c.statusBloqueados||[]).join(', ')}"
                 placeholder="ex: ATC (deixe vazio para aceitar todos)"></div>
        <div class="campo cheio"><label>E-mails que recebem o aviso de pedido novo</label>
          <input id="k-emails" value="${(c.emailsAviso||[]).join(', ')}"></div>
      </div>
      <div class="aviso" style="margin-top:14px">
        <b>Regra de prazo em vigor:</b> até 30 dias de prazo médio o valor é o de tabela menos o
        desconto do cliente. Entre 31 e 60 dias entra acréscimo proporcional, chegando a 2% nos
        60 dias. Acima de 60 dias o pedido não fecha e abre negociação com o representante.
      </div>
      <div class="solto" style="margin-top:14px;justify-content:flex-end">
        <button class="primaria" id="k-salvar">Salvar</button>
      </div>
      <div id="k-ok"></div>
    </div>`;

  $('k-salvar').onclick = async () => {
    await api('/api/admin/config', {
      method:'PUT', headers:{'content-type':'application/json'},

        pedidoMinimo: Number($('k-min').value),
        valorFreteCif: Number($('k-cif').value),
        itensRanking: Number($('k-rank').value),
        statusBloqueados: $('k-status').value.split(',').map(s=>s.trim().toUpperCase()).filter(Boolean),
        emailsAviso: $('k-emails').value.split(',').map(s=>s.trim()).filter(Boolean),
      }),
    });
    $('k-ok').innerHTML = '<div class="aviso ok">Salvo.</div>';
  };
}
